<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnifiedAi - Idle Screen</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
            cursor: none;
        }

        /* Animated background particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(138, 43, 226, 0.3);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(2n) {
            background: rgba(30, 144, 255, 0.3);
            animation-duration: 6s;
            animation-delay: -2s;
        }

        .particle:nth-child(3n) {
            background: rgba(255, 20, 147, 0.3);
            animation-duration: 10s;
            animation-delay: -4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
                opacity: 0.8;
            }
        }

        /* Main container */
        .idle-container {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        /* Logo and branding */
        .logo-section {
            margin-bottom: 3rem;
            animation: fadeInUp 1.5s ease-out;
        }

        .unified-logo {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(45deg, #8a2be2, #1e90ff, #ff1493, #00ff88);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease-in-out infinite;
            margin-bottom: 1rem;
            text-shadow: 0 0 30px rgba(138, 43, 226, 0.5);
        }

        .tagline {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Clock display */
        .clock-section {
            margin-bottom: 3rem;
            animation: fadeInUp 1.5s ease-out 0.3s both;
        }

        .time {
            font-size: 5rem;
            font-weight: 300;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .date {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
        }

        /* Status section */
        .status-section {
            animation: fadeInUp 1.5s ease-out 0.6s both;
            max-width: 600px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .status-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .status-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(138, 43, 226, 0.2);
        }

        .status-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .status-title {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .status-value {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 500;
        }

        /* Unlock prompt */
        .unlock-section {
            animation: fadeInUp 1.5s ease-out 0.9s both;
        }

        .unlock-prompt {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 1rem;
        }

        .unlock-hint {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Pulse animation for interactive elements */
        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.5;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes gradientShift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .unified-logo {
                font-size: 3rem;
            }

            .time {
                font-size: 3rem;
            }

            .status-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .idle-container {
                padding: 1rem;
            }
        }

        /* Hide cursor initially, show on movement */
        body.hide-cursor {
            cursor: none;
        }

        /* Loading state */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #8a2be2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Loading screen -->
    <div id="loading" class="loading">
        <div class="loading-spinner"></div>
        <div class="unified-logo">UnifiedAi</div>
    </div>

    <!-- Main idle screen -->
    <div id="idleScreen" style="display: none;">
        <!-- Animated particles background -->
        <div class="particles" id="particles"></div>

        <!-- Main content -->
        <div class="idle-container">
            <!-- Logo section -->
            <div class="logo-section">
                <div class="unified-logo">UnifiedAi</div>
                <div class="tagline">Meta-Intelligence Platform</div>
            </div>

            <!-- Clock section -->
            <div class="clock-section">
                <div class="time" id="time">00:00:00</div>
                <div class="date" id="date">Loading...</div>
            </div>

            <!-- Status section -->
            <div class="status-section">
                <div class="status-grid">
                    <div class="status-item">
                        <div class="status-icon">🧠</div>
                        <div class="status-title">Brain Thinker</div>
                        <div class="status-value">Active</div>
                    </div>
                    <div class="status-item">
                        <div class="status-icon">⚡</div>
                        <div class="status-title">Meta-Intelligence</div>
                        <div class="status-value">Online</div>
                    </div>
                    <div class="status-item">
                        <div class="status-icon">🔮</div>
                        <div class="status-title">Deep Reasoning</div>
                        <div class="status-value">Ready</div>
                    </div>
                    <div class="status-item">
                        <div class="status-icon">🌌</div>
                        <div class="status-title">Breakthrough Tech</div>
                        <div class="status-value">Available</div>
                    </div>
                </div>
            </div>

            <!-- Unlock section -->
            <div class="unlock-section">
                <div class="unlock-prompt">Touch or press any key to unlock</div>
                <div class="unlock-hint pulse">[SPACE] or [ENTER]</div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            particleCount: 50,
            unlockDelay: 500, // ms to prevent accidental unlocks
            idleTimeout: 30000, // ms before showing idle screen (for future use)
        };

        let lastActivity = Date.now();
        let unlockTimeout = null;

        // Initialize the idle screen
        function init() {
            // Request fullscreen on load
            requestFullscreen();
            
            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('idleScreen').style.display = 'block';
                initParticles();
                initClock();
            }, 2000);

            // Set up event listeners
            setupEventListeners();
        }
        
        // Request fullscreen
        function requestFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => {
                    console.log('Fullscreen request failed:', err);
                });
            } else if (elem.webkitRequestFullscreen) { // Safari
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { // IE/Edge
                elem.msRequestFullscreen();
            } else if (elem.mozRequestFullScreen) { // Firefox
                elem.mozRequestFullScreen();
            }
        }
        
        // Exit fullscreen on unlock
        function exitFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            } else if (document.mozCancelFullScreen) {
                document.mozCancelFullScreen();
            }
        }

        // Create animated particles
        function initParticles() {
            const particlesContainer = document.getElementById('particles');

            for (let i = 0; i < CONFIG.particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';

                // Random positioning and sizing
                const size = Math.random() * 4 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 8 + 's';

                particlesContainer.appendChild(particle);
            }
        }

        // Update clock and date
        function initClock() {
            function updateTime() {
                const now = new Date();
                const timeString = now.toLocaleTimeString('en-US', {
                    hour12: false,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                const dateString = now.toLocaleDateString('en-US', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                document.getElementById('time').textContent = timeString;
                document.getElementById('date').textContent = dateString;
            }

            updateTime();
            setInterval(updateTime, 1000);
        }

        // Set up event listeners for unlocking
        function setupEventListeners() {
            // Only listen for intentional unlock actions
            document.addEventListener('click', handleUnlock, true);
            document.addEventListener('keydown', handleUnlock, true);
            document.addEventListener('touchstart', handleUnlock, true);
            
            // Mouse movement just shows cursor, doesn't unlock
            document.addEventListener('mousemove', showCursor, true);
        }

        // Handle intentional unlock actions
        function handleUnlock(event) {
            // For keyboard, only unlock on Space or Enter
            if (event.type === 'keydown') {
                if (event.code === 'Space' || event.code === 'Enter') {
                    event.preventDefault();
                    unlock();
                    return;
                }
                // Prevent other key actions
                event.preventDefault();
                return;
            }

            // For click or touch, unlock immediately
            if (event.type === 'click' || event.type === 'touchstart') {
                event.preventDefault();
                unlock();
            }
        }

        // Unlock and return to main interface
        function unlock() {
            // Exit fullscreen first
            exitFullscreen();
            
            // Add unlock animation
            document.body.style.transition = 'opacity 0.5s ease-out';
            document.body.style.opacity = '0';

            // Navigate back to main interface after animation
            // Use root URL to ensure proper initialization
            setTimeout(() => {
                // Always go to root to ensure fresh load
                if (window.location.origin) {
                    window.location.href = window.location.origin + '/';
                } else {
                    window.location.href = '/';
                }
            }, 500);
        }

        // Handle cursor visibility
        let cursorTimeout;
        function hideCursor() {
            document.body.classList.add('hide-cursor');
        }

        function showCursor() {
            document.body.classList.remove('hide-cursor');
            clearTimeout(cursorTimeout);
            cursorTimeout = setTimeout(hideCursor, 3000);
        }

        // Initialize cursor hiding after 3 seconds
        setTimeout(() => {
            showCursor();
            document.addEventListener('mousemove', showCursor);
        }, 3000);

        // Start the idle screen
        document.addEventListener('DOMContentLoaded', init);

        // Prevent context menu and other interactions
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
    </script>
</body>
</html>
